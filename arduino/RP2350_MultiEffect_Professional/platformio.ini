; PlatformIO Project Configuration File for RP2350 Multi-Effect Unit
; Professional Version with ST7567S LCD Display
;
; Hardware: Raspberry Pi Pico 2 (RP2350)
; Display: 128x64 LCD ST7567S COG I2C
; Audio: PCM1808 ADC + PCM5102 DAC
;
; Build with: pio run
; Upload with: pio run --target upload

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino

; Board configuration for RP2350
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
board_build.f_flash = 133000000L

; Upload settings
upload_protocol = picotool
upload_port =
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_RASPBERRY_PI_PICO_2
    -DPICO_RP2350=1
    -DPICO_PLATFORM=rp2350
    -Wall
    -Wextra
    -O2

; Library dependencies
lib_deps =
    ; U8g2 graphics library for ST7567S LCD display
    olikraus/U8g2@^2.35.9

    ; Arduino Audio Tools for I2S audio
    pschatzmann/arduino-audio-tools@^0.9.8

    ; I2C Wire library (built-in)
    Wire

; Build options
lib_ldf_mode = deep+
lib_compat_mode = strict

; Optimization for audio performance
build_unflags =
    -Os

build_flags =
    -O2
    -DNDEBUG
    -ffast-math
